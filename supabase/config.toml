# Brevo Conversations calls this directly and can't present a Supabase JWT.
# Protected instead by its own shared-secret check (WHATSAPP_WEBHOOK_SECRET,
# passed as ?secret=... on the webhook URL) — see the function's own code.
[functions.whatsapp-inbound-webhook]
verify_jwt = false

# A Evolution não tem como apresentar um JWT do Supabase. A porta é fechada
# por um segredo compartilhado na querystring, conferido dentro da função —
# mesmo desenho do whatsapp-inbound-webhook logo acima.
[functions.wa-webhook]
verify_jwt = false

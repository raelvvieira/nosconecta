project_id = "ddfteoeehsticjhojpka"

# Brevo Conversations calls this directly and can't present a Supabase JWT.
# Protected instead by its own shared-secret check (WHATSAPP_WEBHOOK_SECRET,
# passed as ?secret=... on the webhook URL) — see the function's own code.
[functions.whatsapp-inbound-webhook]
verify_jwt = false

# A Evolution não tem como apresentar um JWT do Supabase. A porta é fechada
# por um segredo compartilhado na querystring, conferido dentro da função —
# mesmo desenho do whatsapp-inbound-webhook logo acima.
[functions.wa-webhook]
verify_jwt = false

# Migração para fora do Lovable (docs/MIGRACAO.md). As duas fechadas por um
# segredo no cabeçalho `x-migracao`, conferido dentro da função; sem o segredo
# cadastrado, respondem 404. Apagar as duas depois da virada.
[functions.migracao-exportar]
verify_jwt = false

[functions.migracao-receber]
verify_jwt = false

# O Asaas não tem como apresentar um JWT do Supabase. A porta é fechada pelo
# segredo `ASAAS_WEBHOOK_TOKEN`, que ele manda no cabeçalho
# `asaas-access-token` — conferido dentro da função.
[functions.asaas-webhook]
verify_jwt = false

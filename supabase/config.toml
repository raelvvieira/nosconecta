# Brevo Conversations calls this directly and can't present a Supabase JWT.
# Protected instead by its own shared-secret check (WHATSAPP_WEBHOOK_SECRET,
# passed as ?secret=... on the webhook URL) — see the function's own code.
[functions.whatsapp-inbound-webhook]
verify_jwt = false

# O CRM Wavy chama esta função diretamente e não tem como apresentar um JWT do
# Supabase. Protegida pelo próprio segredo compartilhado
# (AI_AGENT_WEBHOOK_SECRET, passado como ?secret=... na URL registrada no CRM)
# — mesmo padrão do webhook do Brevo acima.
[functions.ai-agent-webhook]
verify_jwt = false

# Publica o sistema NOVO (Cloudflare + Supabase) a cada mudança no main.
#
# Substitui o "Publish" do Lovable para a casa nova — ver docs/MIGRACAO.md.
# O Lovable continua sincronizando o main do jeito dele; os dois convivem até
# a virada e, depois dela, só este caminho importa.
#
# O que roda:
#   1. checagem: tipos (`tsc`) e a varredura das Edge Functions. Se falhar,
#      nada é publicado — o site fica na última versão boa.
#   2. site: build + Cloudflare (`scripts/migracao/publicar-site.mjs`).
#   3. rotinas: só quando o commit mexe em `supabase/functions/`.
#
# O que NÃO roda, de propósito: mudança na estrutura do banco. Migration
# errada não se desfaz com outro deploy; ela é aplicada à mão, conferida.
#
# Precisa, em Settings → Secrets and variables → Actions:
#   secrets:   SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN
#   variables: NOVO_PROJETO_REF, NOVO_VAPID_PUBLIC_KEY
# Sem eles, o fluxo para logo no começo com o aviso de qual falta.

name: Publicar sistema novo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois pushes seguidos: o segundo espera o primeiro, nunca publicam juntos.
concurrency:
  group: publicar-sistema-novo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NOVO_PROJETO_REF: ${{ vars.NOVO_PROJETO_REF }}
      NOVO_VAPID_PUBLIC_KEY: ${{ vars.NOVO_VAPID_PUBLIC_KEY }}
    steps:
      - name: Conferir configuração
        run: |
          falta=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || falta="$falta SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta="$falta CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$NOVO_PROJETO_REF" ] || falta="$falta NOVO_PROJETO_REF(variable)"
          if [ -n "$falta" ]; then
            echo "::error::Falta cadastrar no GitHub (Settings → Secrets and variables → Actions):$falta"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Checar tipos e Edge Functions
        run: |
          bunx tsc --noEmit
          node scripts/checar-edge-functions.mjs

      - name: Publicar o site na Cloudflare
        run: node scripts/migracao/publicar-site.mjs

      - name: Mudou alguma rotina?
        id: rotinas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
             || git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^supabase/functions/'; then
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar as rotinas no Supabase
        if: steps.rotinas.outputs.mudou == 'sim'
        run: node scripts/migracao/instalar-funcoes.mjs

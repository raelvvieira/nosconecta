<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7A59" />
    <title>Sem conexão · NÓS Conecta</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fafafa;
        color: #1b1b1f;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: linear-gradient(135deg, #f55f95 0%, #ff7a59 50%, #ffb086 100%);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.03em; }
      p { margin: 0; max-width: 30ch; color: #6b7280; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, #f55f95 0%, #ff7a59 50%, #ffb086 100%);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">N</div>
      <h1>Sem conexão</h1>
      <p>Não foi possível carregar o NÓS Conecta. Confira a internet e tente de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
